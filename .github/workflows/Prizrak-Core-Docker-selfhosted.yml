name: Prizrak-Core-Docker-SelfHosted

on:
  workflow_dispatch:
    inputs:
      build_amd64:
        description: Build linux/amd64
        required: false
        default: true
        type: boolean
      build_arm64:
        description: Build linux/arm64/v8
        required: false
        default: true
        type: boolean
      build_386:
        description: Ignored for Prizrak-Core because linux/386 is unsupported
        required: false
        default: false
        type: boolean
      build_skip:
        description: Skip build
        required: false
        default: false
        type: boolean
      build_force:
        description: Force build even if release exists
        required: false
        default: false
        type: boolean
      recreate_release:
        description: Delete existing GitHub Release before creating a new one
        required: false
        default: false
        type: boolean
      release_skip:
        description: Skip GitHub release creation
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      build_amd64:
        required: false
        default: true
        type: boolean
      build_arm64:
        required: false
        default: true
        type: boolean
      build_386:
        required: false
        default: false
        type: boolean
      build_skip:
        required: false
        default: false
        type: boolean
      build_force:
        required: false
        default: false
        type: boolean
      recreate_release:
        required: false
        default: false
        type: boolean
      release_skip:
        required: false
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate prizrak-core runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck bin/prizrak-core/*.sh tests/prizrak-core/*.sh
          bash tests/prizrak-core/test-asset-name.sh
          bash tests/prizrak-core/test-update-core.sh
          bash tests/prizrak-core/test-entrypoint.sh

  docker:
    needs: validate
    uses: ./.github/workflows/_docker-project-build.yml
    with:
      project_name: prizrak-core
      release_tag_prefix: prizrak-core
      release_name_prefix: prizrak-core
      artifact_prefix: prizrak-core
      repo_ext_name: legiz-ru/Prizrak-Core
      docker_repo: torotin/prizrak-core
      prepare_mode: in-repo-context
      workdir: .
      custom_dockerfile: ./bin/prizrak-core/Dockerfile
      custom_entrypoint: ./bin/prizrak-core/DockerEntrypoint.sh
      custom_init: ./bin/prizrak-core/update-core.sh
      init_target: update-core.sh
      repo_tag_build_arg: PRIZRAK_VERSION
      default_platforms: linux/amd64,linux/arm64/v8
      supported_platforms: linux/amd64,linux/arm64/v8
      build_amd64: ${{ inputs.build_amd64 }}
      build_arm64: ${{ inputs.build_arm64 }}
      build_386: false
      build_skip: ${{ inputs.build_skip }}
      build_force: ${{ inputs.build_force }}
      recreate_release: ${{ inputs.recreate_release }}
      release_skip: ${{ inputs.release_skip }}
    secrets: inherit
