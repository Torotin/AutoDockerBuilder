services:
  prizrak-core:
    image: ${PRIZRAK_CORE_IMAGE:-torotin/prizrak-core:latest}
    container_name: prizrak-core
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-UTC}
      PRIZRAK_REPO: ${PRIZRAK_REPO:-legiz-ru/Prizrak-Core}
      PRIZRAK_CORE_VARIANT: ${PRIZRAK_CORE_VARIANT:-v3}
      PRIZRAK_UPDATE_INTERVAL: ${PRIZRAK_UPDATE_INTERVAL:-1h}
      PRIZRAK_CONTROLLER_URL: ${PRIZRAK_CONTROLLER_URL:-}
      PRIZRAK_SECRET: ${PRIZRAK_SECRET:-}
    volumes:
      # Bind mount hides geo baked under /root/.config/mihomo.
      # Missing geo files are copied from /opt/prizrak/geo on startup; existing files are kept.
      - type: bind
        source: ${PRIZRAK_CONFIG_HOST_DIR:-./prizrak-config}
        target: /root/.config/mihomo
    healthcheck:
      # /opt/prizrak/healthcheck.sh: live PID, or update lock / restart marker
      # so hard-restart does not flap unhealthy during core replace.
      test: ["CMD", "/opt/prizrak/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Expose listeners from config.yaml as needed, for example:
    # ports:
    #   - "${PRIZRAK_HTTP_PORT:-7890}:7890/tcp"
    #   - "${PRIZRAK_SOCKS_PORT:-7891}:7891/tcp"
